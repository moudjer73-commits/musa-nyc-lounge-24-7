name: Musa's NYC Lounge 24/7 Autonomous Engine

on:
  schedule:
    - cron: '15 */5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: nyc-lounge-production-group
  cancel-in-progress: true

jobs:
  run-nyc-lounge:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify System Dependencies (Instant Non-Blocking Check)
        run: |
          which ffmpeg || true

      - name: Install Python Packages
        run: |
          pip install --prefer-binary -q -r requirements.txt

      - name: Run Musa's NYC Lounge (4.8-Hour Relay Cycle)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -u app.py

  live_eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
      - name: Run Golden Set Headless Eval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        run: |
          python3 run_headless_eval.py
