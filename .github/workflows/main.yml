name: Spoken English Lab 24-7 Runner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/state_snapshot.enc'
      - '**.md'
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write
  actions: write

# One bot at a time (two pollers on one token = Telegram "Conflict" errors).
# A new push replaces the running bot (so fixes deploy), but the 5-hour cron and the relay never kill a live bot.
concurrency:
  group: spoken-english-lab-single-instance
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # The tests report problems but never keep the bot offline: a red test is a warning, not an outage.
      - name: Run Verification Suite
        continue-on-error: true
        run: pytest -q

      - name: Restore Encrypted State Snapshot
        env:
          SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
        run: python -m src.db.persist restore

      - name: Run Spoken English Lab
        id: bot_step
        timeout-minutes: 290
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          GEMINI_MODEL_CHAIN: "${{ vars.GEMINI_MODEL_CHAIN || 'gemini-3.5-flash-lite,gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.8-flash' }}"
          SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
          ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
          SEL_SNAPSHOT_PUSH_MIN: ${{ vars.SEL_SNAPSHOT_PUSH_MIN }}
        run: |
          START_TS=$(date +%s)
          timeout --signal=TERM --kill-after=60s 17100s python app.py || true
          END_TS=$(date +%s)
          UPTIME_S=$((END_TS - START_TS))
          if [ "$UPTIME_S" -lt 60 ]; then
            echo "::error::Bot exited after ${UPTIME_S}s"
          fi
          echo "uptime_s=${UPTIME_S}" >> "$GITHUB_OUTPUT"

      - name: Save Encrypted State Snapshot
        if: always()
        env:
          SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
        run: |
          python -m src.db.persist save
          python -m src.db.persist publish

      - name: Relay Next Runner
        if: always() && fromJSON(steps.bot_step.outputs.uptime_s || '0') >= 300
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yml --ref main
