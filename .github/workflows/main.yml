name: Musa NYC Lounge 24-7 Relay

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '15 */5 * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: musa-nyc-lounge-singleton
  cancel-in-progress: true

jobs:
  run-lounge:
    runs-on: ubuntu-latest
    timeout-minutes: 310

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify or Install System Dependencies (Instant Check)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-liberation fonts-dejavu-core
          else
            echo "✅ FFmpeg and system libraries are already pre-installed!"
          fi

      - name: Install Python Packages
        run: |
          pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Run Musa's NYC Lounge (4.7-Hour Relay Cycle)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          python3 app.py

      - name: Trigger Next Relay Cycle Automatically
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run main.yml --repo ${{ github.repository }} || true
