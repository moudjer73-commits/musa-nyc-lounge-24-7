name: Musa's NYC Lounge 24/7 Autonomous Engine

on:
  schedule:
    - cron: '15 */5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: nyc-lounge-production-group
  cancel-in-progress: true

jobs:
  run-nyc-lounge:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify System Dependencies (Instant Non-Blocking Check)
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "✅ ffmpeg is pre-installed and ready!"
          else
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi

      - name: Install Python Packages
        run: |
          pip install --prefer-binary -q -r requirements.txt

      - name: Run Musa's NYC Lounge (4.8-Hour Relay Cycle)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -u app.py
