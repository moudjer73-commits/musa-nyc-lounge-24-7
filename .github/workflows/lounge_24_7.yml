name: Musa NYC Lounge 24/7 Relay

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-lounge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info fonts-dejavu-core
          pip install -q -U huggingface_hub requests edge-tts weasyprint pypdf pyTelegramBotAPI google-genai groq pydantic

      - name: Run Musa's NYC Lounge (5.3-Hour Relay Cycle)
        env:
          MAX_RUNTIME_HOURS: "5.3"
        run: |
          python3 -u app.py
