name: Musa NYC Lounge 24-7 Relay

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */5 * * *'

concurrency:
  group: musa-nyc-lounge-single-active-server
  cancel-in-progress: true

jobs:
  run-lounge:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & WeasyPrint Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-dejavu-core

      - name: Install Python Packages
        run: |
          pip install -q pyTelegramBotAPI google-genai pydantic edge-tts weasyprint pypdf requests

      - name: Run Musa's NYC Lounge (5.3-Hour Relay Cycle)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 app.py
